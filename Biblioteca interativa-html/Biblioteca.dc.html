  style: "display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 12px; text-align: left; font-family: Nunito, sans-serif; cursor: pointer; border: 2px solid " + (i === st.sel ? "#2B2F33; background: #2B2F33; color: #FFFFFF" : "transparent; background: transparent; color: #2B2F33")
}));
return { c, en, ef, fq, pr, chips, list, name: cur[0], group: GR[cur[1]], count: vis.length,
  posLabel: (pos >= 0 ? (pos + 1) + " de " + vis.length : vis.length + " na lista"), total: D.length,
  q: st.q, onQ: (e) => this.setState({ q: e.target.value }), prev: go(-1), next: go(1), empty: vis.length === 0 };
}
renderVals() {
return this.extra();
}
}
</script>
</body>
