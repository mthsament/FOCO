<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1b2d" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // aplica o tema antes de pintar, para não piscar
      try {
        var p = localStorage.getItem('foco-theme');
        var t = p === 'light' || p === 'dark' ? p : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#08101a' : '#0f1b2d');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FOCO" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>FOCO</title>
    <style>
      /* Tela de abertura: fica no HTML (aparece antes do JavaScript carregar) e é removida pelo app quando está pronto. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 22px; background: #0f1b2d; transition: opacity 320ms cubic-bezier(.23,1,.32,1), visibility 0s linear 320ms; }
      :root[data-theme="dark"] #splash { background: #08101a; }
      #splash.sai { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash svg { width: 118px; height: 118px; overflow: visible; }
      #splash .sp-r { fill: none; stroke-linecap: round; transform-origin: 60px 60px; transform: rotate(-90deg); animation: sp-tracar 800ms cubic-bezier(.23,1,.32,1) both; }
      #splash .r1 { stroke: rgba(255,255,255,.88); stroke-width: 5; stroke-dasharray: 327; }
      #splash .r2 { stroke: rgba(255,255,255,.88); stroke-width: 5; stroke-dasharray: 201; animation-delay: 140ms; }
      #splash .sp-p { fill: #ff6b35; transform-origin: 60px 60px; animation: sp-ponto 520ms cubic-bezier(.34,1.56,.64,1) 480ms both; }
      #splash .sp-eco { fill: none; stroke: #ff6b35; stroke-width: 3; transform-origin: 60px 60px; opacity: 0; animation: sp-eco 1900ms cubic-bezier(.23,1,.32,1) 1000ms infinite; }
      #splash .sp-nome { display: flex; gap: 10px; font: 700 40px/1 'Barlow Condensed', system-ui, sans-serif; letter-spacing: 6px; color: #fff; padding-left: 6px; }
      #splash .sp-nome span { display: inline-block; animation: sp-letra 520ms cubic-bezier(.23,1,.32,1) both; }
      #splash .sp-nome span:nth-child(1) { animation-delay: 420ms; } #splash .sp-nome span:nth-child(2) { animation-delay: 490ms; }
      #splash .sp-nome span:nth-child(3) { animation-delay: 560ms; } #splash .sp-nome span:nth-child(4) { animation-delay: 630ms; color: #ff6b35; }
      #splash .sp-barra { width: 92px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; opacity: 0; animation: sp-letra 400ms ease-out 800ms both; }
      #splash .sp-barra i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #ff6b35; animation: sp-corre 1.1s cubic-bezier(.65,0,.35,1) 800ms infinite; }
      @keyframes sp-tracar { from { stroke-dashoffset: 327; opacity: 0; } 12% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes sp-ponto { from { transform: scale(0); } to { transform: scale(1); } }
      @keyframes sp-eco { 0% { transform: scale(.55); opacity: .75; } 100% { transform: scale(2.1); opacity: 0; } }
      @keyframes sp-letra { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes sp-corre { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition-duration: 1ms !important; }
        #splash .sp-r { stroke-dashoffset: 0; } #splash .sp-barra { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Carregando o FOCO">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="sp-eco" cx="60" cy="60" r="30" />
        <circle class="sp-r r1" cx="60" cy="60" r="52" />
        <circle class="sp-r r2" cx="60" cy="60" r="32" />
        <circle class="sp-p" cx="60" cy="60" r="10" />
      </svg>
      <div class="sp-nome" aria-hidden="true"><span>F</span><span>O</span><span>C</span><span>O</span></div>
      <div class="sp-barra" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
