name = "foco-lembretes"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
VAPID_PUBLIC = "COLE_AQUI_A_CHAVE_PUBLICA"
# VAPID_SUB (seu e-mail), VAPID_PRIVATE_JWK e FOCO_TOKEN ficam como secrets, fora do repositório.

[triggers]
crons = ["*/5 * * * *"]

# Depois de rodar `npx wrangler kv namespace create FOCO_KV`, cole o id aqui:
[[kv_namespaces]]
binding = "FOCO_KV"
id = "COLE_AQUI_O_ID_DO_KV"
